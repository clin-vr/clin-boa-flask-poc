services:
  evidence-api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      SHAREPOINT_BASE_URL: http://sharepoint-mock:8000
      SHAREPOINT_ALLOWED_HOSTS: sharepoint-mock
      OPA_URL: http://opa:8181
      TEMPLATES_DIR: /app/templates
      FIXTURES_DIR: /app/fixtures
    volumes:
      - ./templates:/app/templates:ro
      - ./fixtures:/app/fixtures:ro
    depends_on:
      opa:
        condition: service_started
      sharepoint-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.21.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--watch", "/policies/checks", "/policies/policies", "/policies/data"]
    ports:
      - "8181:8181"
    volumes:
      - ./opa:/policies:ro

  sharepoint-mock:
    build: ./sharepoint-mock
    ports:
      - "8000:8000"
    environment:
      SHAREPOINT_BASE_URL: http://sharepoint-mock:8000
      FIXTURES_DIR: /fixtures
    volumes:
      - ./fixtures:/fixtures
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
